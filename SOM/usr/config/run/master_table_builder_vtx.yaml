_vtx:
  schema: v1
  kind: processor
  id: master_table_builder_vtx
  title: Master Table Builder VTX
  description: Staged master builder for application/server inventories.
  owner: default
  version: 1.0.0
  tags:
  - inventory
  - masterdata
  - decisions
  consumers:
  - usr/scripts/default/master_table_builder_vtx.py
  _vtx_origin: CUSTOM:usr/config/custom/master_table_builder_vtx.yaml
config:
  payload:
    schema_contracts:
      raw_application_table:
        path: var/masterdata/raw_application_table.parquet
        anchor_field: ID
      raw_server_table:
        path: var/masterdata/raw_server_table.parquet
        anchor_field: Hostname
      application_approximation:
        path: var/masterdata/application_approximation.parquet
        anchor_field: ID
      master_applications:
        path: var/masterdata/master_applications.parquet
        anchor_field: ID
      master_servers:
        path: var/masterdata/master_servers.parquet
        anchor_field: Hostname
    jobs:
    - id: build_master_applications
      enabled: true
      base:
        path: var/masterdata/raw_application_table.parquet
        anchor_field: ID
      joins:
      - alias: app_approx
        path: var/masterdata/application_approximation.parquet
        left_key: ID
        right_key: ID
        include_fields: '*'
      - alias: server_inventory
        path: var/masterdata/raw_server_table.parquet
        left_key: RECORDID
        right_key: RECORDID
        include_fields:
        - IP Address
        - Environment
        - Hostname
        - OS
        - OS Version
      inferred_decisions:
        path: bin/ui/inferred_decision_engine_v2.csv
        required_status: approved
        max_iterations: 10
      coalesce:
      - target_field: Planned Disposition
        source_fields:
        - Disposition Override
        - Assumed Disposition
      - target_field: Business Owner
        source_fields:
        - Business_Contact_Primary
        - ApproxValue::Business_Contact_Primary
        - default_role_identity_Business_Contact_Primary
      - target_field: Technical Owner
        source_fields:
        - Technical_Lead
        - ApproxValue::Technical_Lead
        - default_role_identity_Technical_Lead
      outputs:
        parquet: var/masterdata/master_applications.parquet
        csv: var/masterdata/master_applications.csv
    - id: build_master_servers
      enabled: true
      base:
        path: var/masterdata/raw_server_table.parquet
        anchor_field: Hostname
      joins:
      - alias: appinventory
        path: var/masterdata/raw_application_table.parquet
        left_key: RECORDID
        right_key: RECORDID
        include_fields:
        - ID
        - TITLE_NAME
      inferred_decisions:
        path: bin/ui/inferred_decision_engine_v2.csv
        required_status: approved
        max_iterations: 10
      coalesce:
      - target_field: Final Server Disposition
        source_fields:
        - Server_Disposition
        - Planned Disposition
      outputs:
        parquet: var/masterdata/master_servers.parquet
        csv: var/masterdata/master_servers.csv
    - id: build_billing_server_only
      enabled: true
      base:
        path: var/masterdata/master_servers.csv
        anchor_field: RECORDID
      joins:
      - alias: windows_wvmstor
        path: var/tables/billing2026.csv
        left_key: Hostname
        right_key: Attribute 1 (Name)
        normalizations:
        - normalize_case: true
        - force_short_hostname: true
        right_table_filters:
        - field: Period
          operator: ==
          value: '202605'
        - field: Service Category
          operator: in
          values:
          - Unix Servers
          - Window Servers
        - field: Service
          operator: ==
          value: WVMSTOR
        include_fields:
        - source_field: Charges
          output_field: charges_wvmstor
      - alias: windows_winlinvm
        path: var/tables/billing2026.csv
        left_key: Hostname
        right_key: Attribute 1 (Name)
        normalizations:
        - normalize_case: true
        - force_short_hostname: true
        right_table_filters:
        - field: Period
          operator: ==
          value: '202605'
        - field: Service Category
          operator: in
          values:
          - Unix Servers
          - Window Servers

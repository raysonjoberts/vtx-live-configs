          value: WINDOWS
        include_fields:
        - source_field: Charges
          output_field: charges_windows
      - alias: windows_wincloud
        path: var/tables/billing2026.csv
        left_key: Hostname
        right_key: Attribute 1 (Name)
        normalizations:

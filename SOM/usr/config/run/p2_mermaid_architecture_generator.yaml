_vtx:
  schema: v1
  kind: transform
  id: mermaid_architecture_generator
  title: Mermaid Architecture Generator
  description: Generate Mermaid Markdown architecture diagrams from architectural
    drawing views.
  owner: default
  version: 1.0.0
  tags:
  - reporting
  - architecture
  consumers:
  - usr/scripts/default/p2_mermaid_architecture_generator.py
  _vtx_origin: CUSTOM:usr/config/custom/p2_mermaid_architecture_generator.yaml
config:
  payload:
    jobs:
    - id: mermaid_architecture_generator
      enabled: true
      input: var\pipelines\p2_architecture_repo_pipeline\consolidated_apps_with_dbs.csv
      output_dir: var/pipelines/p2_architecture_repo_pipeline/architecture_diagrams
      inputs:
      - var\pipelines\p2_architecture_repo_pipeline\consolidated_apps_with_dbs.csv
      outputs:
      - var/pipelines/p2_architecture_repo_pipeline/architecture_diagrams
      clean_output_dir: true
      delimiter: ;
      mermaid_direction: LR
      columns:
        application_id: ID
        application: TITLE_NAME
        application_acronym: ACRONYM
        department: DEPARTMENT_NAME
        environment: Environment
        hostname: Hostname
        ip_address: IP Address
        database_name: NAME
        application_layer: Application_Layer
        display_label: Display_Label
        notes: Notes
        migration_exclusions: tag_migration_panning_exclusions
      database_hostname_patterns:
      - exadata
      - sql
      - exp
      information_sections:
      - field: tag_migration_planning_exclusions
        heading: Migration Planning
        delimiter: ;
        prefix: ❌
      context_rules:
      - field: External Prod ARR Hostname
        operator: isnotnull
        context: Architecture Warnings
        message: ⚠️ Public ARR Server
      - field: External Test ARR Hostname
        operator: isnotnull
        context: Architecture Warnings
        message: ⚠️ Public ARR Server
      - field: Internal Prod ARR Hostname
        operator: isnotnull
        context: Architecture Warnings
        message: ⚠️ Internal ARR Server
      - field: Internal Test ARR Hostname
        operator: isnotnull
        context: Architecture Warnings
        message: ⚠️ Internal ARR Server
      - field: Hostname
        operator: contains
        value: w-b1vwiwbp1
        context: Architecture Warnings
        message: ⚠️ Internal Production Shared IIS Server
      - field: Hostname
        operator: contains
        value: w-a1vwxwbp1
        context: Architecture Warnings
        message: ⚠️ External Production Shared IIS Server
      - field: Hostname
        operator: contains
        value: w-b3vwiwbt1
        context: Architecture Warnings
        message: ⚠️ Internal Test Shared IIS Server
      - field: Hostname
        operator: contains
        value: w-a3vwxwbt1
        context: Architecture Warnings
        message: ⚠️ External Test Shared IIS Server
      labels:
        information: Application Information
        dmz: DMZ
        internal_networks: Internal Networks
        unknown: Unknown
        database_servers: Database Servers
        databases: Databases
        warnings: Migration Planning Exclusions
        warning_prefix: ❌
        web_icon: 🌐
        sql_icon: 🗄
        database_server: Database Server
      colors:
        server_fill: '#FFFFFF'
        server_stroke: '#666'
        server_text: '#222'
        arr_server_fill: '#FFFFFF'
        arr_server_stroke: '#666'
        arr_server_text: '#222'
        database_server_fill: '#FFFFFF'
        database_server_stroke: '#666'
        database_server_text: '#222'
        database_fill: '#FFFFFF'
        database_stroke: '#666'
        database_text: '#222'
        zone_fill: '#FFF7D6'
        zone_stroke: '#C9A227'
        layer_fill: '#F8E29B'
        layer_stroke: '#A66A00'
  _vtx_origin: DEFAULT:usr/config/default/mermaid_architecture_generator.yaml

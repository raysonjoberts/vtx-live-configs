scheduler:
  max_workers: 4
  backbone_check_hz: 1.0
  backbone_tick_hz: 20
  backbone_target_ms_per_sec: 25
  backbone_stat_benchmark_samples: 12
  backbone_stat_benchmark_iters: 200
  _vtx_origin: CUSTOM:usr/config/custom/orchestrator.yaml
cron_jobs:
- id: Run Snapshot Statistics
  enabled: true
  role: server
  script: usr/scripts/default/snapshot_statistics.py
  args: --mode=auto
  cwd: ''
  env: {}
  schedule:
    cron: 30 22 * * *
  timeout_seconds: 1800
  retries: 1
  backoff_seconds: 10
  jitter_seconds: 5
  run_on_start: false
  _vtx_origin: DEFAULT:usr/config/default/orchestrator.yaml
- id: Run Data Source Type Profiler
  enabled: true
  role: server
  script: usr/scripts/default/datasource_type_profiler.py
  args: --mode=auto
  cwd: ''
  env: {}
  schedule:
    cron: 1 12 * * 0
  timeout_seconds: 1800
  retries: 1
  backoff_seconds: 10
  jitter_seconds: 5
  run_on_start: false
  _vtx_origin: DEFAULT:usr/config/default/orchestrator.yaml
- id: Copy var/interactive /views to dailysnapshot
  enabled: true
  role: server
  script: usr/utils/file_move.py
  args: '--source "var/interactive/views/*.csv" --dest "var/dailysnapshot" --mode
    copy --append-date yes --date-format %Y%m%d --skip-missing yes

    '
  schedule:
    cron: 41 18 * * *
  timeout_seconds: 180
  retries: 1
  backoff_seconds: 10
  _vtx_origin: DEFAULT:usr/config/default/orchestrator.yaml
- id: Copy var/tables/views to dailysnapshot
  enabled: true
  role: server
  script: usr/utils/file_move.py
  args: '--source "var/tables/views/*.csv" --dest "var/dailysnapshot" --mode copy
    --append-date yes --date-format %Y%m%d --skip-missing yes

    '
  schedule:
    cron: 45 18 * * *
  timeout_seconds: 180
  retries: 1
  backoff_seconds: 10
  _vtx_origin: DEFAULT:usr/config/default/orchestrator.yaml
- id: Copy var/interactive to dailysnapshot
  enabled: true
  role: server
  script: usr/utils/file_move.py
  args: '--source "var/interactive/*.csv" --dest "var/dailysnapshot" --mode copy --append-date
    yes --date-format %Y%m%d --skip-missing yes

    '
  schedule:
    cron: 45 18 * * *
  timeout_seconds: 180
  retries: 1
  backoff_seconds: 10
  _vtx_origin: DEFAULT:usr/config/default/orchestrator.yaml
- id: Copy var/tables to dailysnapshot
  enabled: true
  role: server
  script: usr/utils/file_move.py
  args: '--source "var/tables/*.csv" --dest "var/dailysnapshot" --mode copy --append-date
    yes --date-format %Y%m%d --skip-missing yes

    '
  schedule:
    cron: 40 18 * * *
  timeout_seconds: 180
  retries: 1
  backoff_seconds: 10
  _vtx_origin: DEFAULT:usr/config/default/orchestrator.yaml
- id: Move zipped logs to log archive
  enabled: true
  role: server
  script: usr/utils/file_move.py
  args: '--source "var/logs/*.gz" --dest "var/logarchive" --mode move --append-date
    no --date-format %Y%m%d --skip-missing yes

    '
  schedule:
    cron: 47 * * * *
  timeout_seconds: 180
  retries: 1
  backoff_seconds: 10
  _vtx_origin: DEFAULT:usr/config/default/orchestrator.yaml
- id: Move zipped logs to log archive
  enabled: true
  role: client
  script: usr/utils/file_move.py
  args: '--source "var/logs/*.gz" --dest "var/logarchive" --mode move --append-date
    no --date-format %Y%m%d --skip-missing yes

    '
  schedule:
    cron: 47 * * * *
  timeout_seconds: 180
  retries: 1
  backoff_seconds: 10
  _vtx_origin: DEFAULT:usr/config/default/orchestrator.yaml
backbone_jobs:
- id: Run Intake Processor
  enabled: true
  role: server
  script: usr/scripts/default/intake_processor.py
  args: '--mode=auto

    '
  settle_seconds: 2
  debounce_seconds: 5
  rule: any_file_in_dir
  watch_dirs:
  - var/customerdata
  watch_glob: null
  timeout_seconds: 120
  retries: 1
  backoff_seconds: 10
  jitter_seconds: 0
  _vtx_origin: DEFAULT:usr/config/default/orchestrator.yaml
- id: Run config_compiler
  enabled: true
  role: server
  script: usr/scripts/default/config_compiler.py
  args: null
  settle_seconds: 2
  debounce_seconds: 5
  rule: mtime_input_newer_than_last_success_marker
  config_inputs:
  - usr/config/run/orchestrator.yaml
  watch_dirs:
  - usr/config/default
  - usr/config/auto_v2
  - usr/config/custom
  watch_glob: null
  timeout_seconds: 120
  retries: 1
  backoff_seconds: 10
  jitter_seconds: 0
  _vtx_origin: DEFAULT:usr/config/default/orchestrator.yaml
- id: file_distribution_engine - psdo_consolidated_apps_base_062302026
  enabled: true
  role: server
  script: usr/scripts/default/file_distribution_engine.py
  args: --job "psdo_consolidated_apps_base_062302026"
  settle_seconds: 2
  debounce_seconds: 5
  rule: mtime_input_newer_than_last_success_marker

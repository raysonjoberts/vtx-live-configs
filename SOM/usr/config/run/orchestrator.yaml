  script: usr/scripts/default/file_distribution_engine.py
  args: --job "psdo_consolidated_applications_interactive_06302026"
  settle_seconds: 2
  debounce_seconds: 5
  rule: mtime_input_newer_than_last_success_marker
  timeout_seconds: 120
  retries: 1
  backoff_seconds: 10
  jitter_seconds: 0
  marker_match: any
  inputs:
  - C:/Users/Jayson.Roberts/State of Maine/DAFS-MaineIT CCOE - Data Dog/Correlated_Data\CCoE_Inventory/migrations_application_view.xlsx
  config_inputs:

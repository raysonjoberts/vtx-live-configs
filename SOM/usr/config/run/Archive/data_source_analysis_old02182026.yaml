- attribute: Interface Mechanisms
  type: application
  blocks: Migration Execution
  category: program
  priority_level: 3
  recommended source: architecture repo
  CCoE Program Impact: low
  required: true
  priority: false
  description: The ways in which people and other applications interfaces with this
    application.
  examples: flat file, API, ftp, direct sql
  how used: Migration Execution, ensuring the function of the Application post migration.
  field_name_patterns:
    like:
    - authentication
    - auth
  value_heuristics:
  - pattern: \b(api|rest[_\s]?api|soap|graphql)\b
    explanation: Application Programming Interface (API-based integration such as
      REST, SOAP, or GraphQL)
  - pattern: \b(flat[_\s]?file|csv|tsv|excel|xls[x]?|text[_\s]?file)\b
    explanation: Flat file interface (data exchanged via structured files such as
      CSV, TSV, Excel, or text)
  - pattern: \b(mq|message[_\s]?queue|ibm[_\s]?mq|rabbitmq|activemq|kafka)\b
    explanation: Messaging Queue interface (asynchronous message-based integration
      such as IBM MQ, RabbitMQ, ActiveMQ, Kafka)
  - pattern: \b(database|db|sql|jdbc|odbc)\b
    explanation: Database interface (direct integration via SQL queries, JDBC, or
      ODBC connections)
  - pattern: \b(ftp|sftp|ftps)\b
    explanation: File Transfer Protocol interface (integration via FTP, SFTP, or FTPS)
  - pattern: \b(http[s]?|web[_\s]?service|soap[_\s]?service)\b
    explanation: Web service interface (integration over HTTP/HTTPS including SOAP
      services)
  - pattern: \b(edi|x12|edifact|hl7)\b
    explanation: Electronic Data Interchange (EDI-based integration such as X12, EDIFACT,
      HL7 for healthcare)
  - pattern: \b(rpc|xml[_\s]?rpc|json[_\s]?rpc)\b
    explanation: Remote Procedure Call interface (synchronous service invocation using
      RPC, XML-RPC, or JSON-RPC)
  - pattern: \b(file[_\s]?drop|shared[_\s]?folder|network[_\s]?share)\b
    explanation: File drop or shared folder interface (integration by placing and
      consuming files in shared directories)
  - pattern: \b(webhook|callback|event[_\s]?notification)\b
    explanation: Event-driven interface (push integration via webhooks, callbacks,
      or event notifications)
  - pattern: \b(saas[_\s]?connector|integration[_\s]?platform|mulesoft|boomi|informatica|workato)\b
    explanation: Integration Platform as a Service (iPaaS or middleware-based integration
      using tools like MuleSoft, Boomi, Informatica, Workato)
  min_viable_ratio: 0.05
  min_match_ratio: 0.5
  match_requirements:
  - name
  - value
  _vtx_origin: DEFAULT:usr/config/default/data_source_analysis_old02182026.yaml

- attribute: Architecture Tier/Model
  type: application
  recommended source: architecture repo
  blocks: Migration Execution
  category: program
  priority_level: 3
  CCoE Program Impact: low
  required: true
  priority: false
  description: A identification of the Application Architecture model to help identify
    the complexity of the Application. This may indicate number of servers in an Application
    but is more of a reference to the architecture and how the application functions.
    -- i.e. a single server still could support a 3 tier application. This type of
    information may be found in a Architectural Repo instead of a typical inventory
    system.
  examples: 3 Tier, 2 Tier/Condensed, Monolithic, n-Tier
  how used: Application Complexity may be determined using the Architecture Model
    which would be used in Migration Planning and Execution for Business Risk Mitigation.
    However, in a strict rehost disposition, this definition may not be required as
    it is more determinative for identifying modernization candidates.
  field_name_patterns:
    like:
    - Architecture Tier/Model
  value_heuristics:
  - pattern: ^(?:y|n|yes|no)$
    explanation: tbd
  - pattern: ^(?i)(monolithic|2[- ]?tier|3[- ]?tier|n[- ]?tier|multi[- ]?tier|web/app(/db)?|web[-
      ]?tier|app[- ]?tier|db[- ]?tier|compressed)$
    explanation: tbd
  min_viable_ratio: 0.05
  min_match_ratio: 0.5
  match_requirements:
  - name
  - value
  _vtx_origin: DEFAULT:usr/config/default/data_source_analysis_old02182026.yaml

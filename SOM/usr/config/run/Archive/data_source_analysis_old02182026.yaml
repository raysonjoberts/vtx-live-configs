criteria:
- attribute: Application Components
  type: application
  blocks: Migration Execution
  category: program
  priority_level: 2
  recommended source: architecture repo
  CCoE Program Impact: low
  required: true
  priority: false
  description: A listing of components that make up an application (web, app, db,
    rds, etc.) This type of information may be found in a Architectural Repo instead
    of a typical inventory system.
  how used: Used to determine complexity of the application for logistics/ business
    risk mitigation.
  examples: web, app, db, rds, vdi
  field_name_patterns:
    like:
    - Application Components
  value_heuristics:
  - pattern: ^(?:y|n|yes|no)$
    explanation: tbd
  - pattern: ^(?i)(web|application|app|database|db|web/app|monolithic|bastion access|rds|vdi|frontend|backend|middleware|api|service|microservices?|message
      broker|cache|load balancer|auth(?:entication|orization)?|identity|storage|file
      server|queue|etl|reporting|container|vm|virtual desktop|cloud function|gateway|proxy|firewall|dns|cdn|monitoring|logging)$
    explanation: tbd
  min_viable_ratio: 0.05
  min_match_ratio: 0.5
  match_requirements:
  - name
  - value
  _vtx_origin: DEFAULT:usr/config/default/data_source_analysis_old02182026.yaml
- attribute: Application ID
  type: application
  blocks: Discover
  category: program
  priority_level: 1
  recommended source: application inventory
  CCoE Program Impact: High
  required: true
  priority: true
  used_pct_exp: The percentage of non-null values in this field in the data source.
  match_ratio_exp: The percentage of non-null values which match the patterns defined
    for this Program Attribute.
  unique_exp: For this Program Attribute,a high percentage of unique values is a positive
    indicator as this uniquely identifies the Application.
  dispersion_exp: For this Program Attribute, it is expected that entries are going
    to be similar to each other and a low difference between the average entry and
    the =/- standard deviation is a good indicator.
  description: If it exists, an Application ID is typically a unique identifier for
    an Application, usually consisting of a number.
  examples: 101, AP101, dept-101
  how used: Every Application must be able to be uniquely identified in order to be
    tracked through the Transformation Process. If the Application Name is not unique,
    or Application ID Is used in the Inventory System, Application ID wil often be
    used to uniquely identify the Application.
  field_name_patterns:
    like:
    - app_id
    - application_id
    - appid
    not_like:
    - bureau
    - department
    - server
    - dns
    - host
    - hostname
  value_heuristics:
  - pattern: .*\d{3,}.*
    explanation: Must contain at least 3 digits
  - pattern: ^[A-Za-z0-9_-]+$
    explanation: Alphanumeric with optional dashes/underscores
  min_viable_ratio: 0.1
  min_match_ratio: 0.2
  min_unique_ratio: 0.6
  min_length: 3
  max_length: 10
  match_requirements:
  - name
  - value
  _vtx_origin: DEFAULT:usr/config/default/data_source_analysis_old02182026.yaml
- attribute: Application Name
  type: application
  blocks: Discover
  category: program
  priority_level: 1
  recommended source: application inventory
  CCoE Program Impact: high
  required: true
  priority: true
  used_pct_exp: The percentage of non-null values in this field in the data source.
  match_ratio_exp: The percentage of non-null values which match the patterns defined
    for this Program Attribute.
  unique_exp: For this Program Attribute,a high percentage of unique values is a positive
    indicator as this uniquely identifies the Application.
  dispersion_exp: For this Program Attribute, it is expected that entries are going
    to be similar to each other and a low difference between the average entry and
    the =/- standard deviation is a good indicator.
  description: A unique and descriptive name for an application, often a readable
    word or phrase.
  examples: ServiceNow, infoblox, sharepoint
  how used: Each Application  must have a unique identifier in order to track progress
    through the Transformation Process and often, the Application name is unique,
    so it will be used for identification.
  field_name_patterns:
    like:
    - application
    - appname
    - title
    - name
    not_like:
    - bureau
    - department
    - server
    - dns
    - host
    - hostname
  value_heuristics:
  - pattern: ^[A-Za-z0-9][A-Za-z0-9 ()/_\.-]{2,100}$
    explanation: Short application-like names, no digits or filler words
  min_viable_ratio: 0.1
  min_match_ratio: 0.5
  min_unique_ratio: 0.3
  min_length: 3
  max_length: 100
  match_requirements:
  - name
  - value
  _vtx_origin: DEFAULT:usr/config/default/data_source_analysis_old02182026.yaml

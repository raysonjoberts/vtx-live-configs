_vtx:
  schema: v1
  kind: config
  id: inferred_decision_engine_vtx
  title: Inferred Decision Engine (table-driven)
  version: 1.0.0
  owner: default
  tags:
  - inference
  - table_driven
  - dashboard
  consumers:
  - usr/scripts/default/inferred_decision_engine_vtx.py
  _vtx_origin: DEFAULT:usr/config/default/inferred_decision_engine_vtx.yaml
config:
  jobs: &id001
  - id: Inferred Decisions - applications.csv
    enabled: true
    key_field: ID
    primary_source: var/tables/applications.csv
    inputs:
    - var/tables/applications.csv
    sources:
    - var/tables/applications.csv
    infer:
    - field: Inferred Scope
      default: ''
      rules:
      - when:
          all:
          - field: ACTIVE
            op: ==
            value: N
        set: Out of Scope
  - id: Inferred Decisions - consolidated_application_view*.parquet
    enabled: true
    key_field: ID
    primary_source: var/masterdata/consolidated_application_view*.parquet
    inputs:
    - var/masterdata/consolidated_application_view*.parquet
    sources:
    - var/masterdata/consolidated_application_view*.parquet
    infer:
    - field: Inferred Hosting Type
      default: ''
      rules:
      - when:
          all:
          - field: Inferred Server Location
            op: ==
            value: CMCC
        set: OnPrem
      - when:
          all:
          - field: Inferred Server Location
            op: ==
            value: SSDC
        set: OnPrem
      - when:
          all:
          - field: Inferred Server Location
            op: ==
            value: Azure
        set: Cloud
      - when:
          all:
          - field: Inferred Server Location
            op: ==
            value: CMCC;SSDC
        set: OnPrem Multisite
      - when:
          all:
          - field: Inferred Server Location
            op: ==
            value: SSDC;CMCC

_vtx:
  schema: v1
  kind: transform
  id: auto_table_aggregator
  title: Auto Table Aggregator (V2)
  description: Auto-generated fully expanded raw application table jobs.
  owner: default
  version: 1.0.0
  tags:
  - aggregation
  - transform
  - masterdata
  - auto
  consumers:
  - usr/scripts/default/application_raw_table_builder.py
  _vtx_origin: AUTO_V2:usr/config/auto_v2/table_aggregator_vtx.yaml
config:
  io:
    inputs: []
    outputs: []
  run:
    enabled: true
    role: any
    log_level: INFO
    dry_run: false
    fail_fast: false
    cwd: ''
  payload:
    jobs:
    - id: consolidated_application_view_auto
      enabled: true
      outputs:
        parquet: var/masterdata/raw_application_table_auto.parquet
        manifest_yaml: usr/config/manifests/raw_application_table_manifest_auto.yaml
      seed: var/tables/applications.csv
      transactions:
      - type: lookup_replace
        lookup_table: var/tables/application_status_lu.csv
        key: ID
        seed_field: APPLICATION_STATUS_ID
        lookup_field: DESCRIPTION
        output_field: DESCRIPTION
      - type: lookup_replace
        lookup_table: var/tables/oper_level_lu.csv
        key: ID
        seed_field: OPER_LEVEL
        lookup_field: DESCRIPTION
        output_field: DESCRIPTION
      - type: lookup_replace
        lookup_table: var/tables/risk_urgency_lu.csv
        key: ID
        seed_field: RISK_URGENCY_ID
        lookup_field: DESCRIPTION
        output_field: DESCRIPTION
      - type: lookup_replace
        lookup_table: var/tables/waiver_risk_lu.csv
        key: CODE
        seed_field: RISK_URGENCY_ID
        lookup_field: DESCRIPTION
        output_field: DESCRIPTION
      - type: lookup_replace
        lookup_table: var/tables/auth_method_lu.csv
        key: ID
        seed_field: AUTHENTICATION_METHOD
        lookup_field: DESCRIPTION
        output_field: DESCRIPTION
      - type: lookup_replace
        lookup_table: var/tables/who_administers_lu.csv
        key: ID
        seed_field: WHO_ADMINISTERS
        lookup_field: DESCRIPTION
        output_field: DESCRIPTION
      - type: lookup_replace
        lookup_table: var/tables/who_maintains_lu.csv
        key: ID
        seed_field: WHO_MAINTAINS
        lookup_field: DESCRIPTION
        output_field: DESCRIPTION
      - type: lookup_replace
        lookup_table: var/tables/application_types_lu.csv
        key: ID
        seed_field: APPLICATION_TYPE_ID
        lookup_field: DESCRIPTION
        output_field: DESCRIPTION
      - type: lookup_replace
        lookup_table: var/tables/business_category_lu.csv
        key: ID
        seed_field: BUSINESS_CATEGORY
        lookup_field: DESCRIPTION
        output_field: DESCRIPTION
      - type: lookup_replace
        lookup_table: var/tables/tlp_lu.csv
        key: ID
        seed_field: TLP_RATING
        lookup_field: TLP
        output_field: TLP
      - type: lookup_replace
        lookup_table: var/tables/ps_development_lu.csv
        key: ID
        seed_field: PS_DEVELOPMENT_CODE
        lookup_field: DESCRIPTION
        output_field: DESCRIPTION
      - type: simple_lookup
        lookup_table: var/tables/application_x_database.csv
        key: APP_ID
        seed_field: ID
      - type: simple_lookup
        lookup_table: var/tables/databases.csv
        key: ID
        seed_field: DATABASE_ID
      - type: simple_lookup
        lookup_table: var/tables/waivers_x_applications.csv
        key: APP_ID
        seed_field: ID
      - type: simple_lookup
        lookup_table: var/tables/bfms_organizations.csv
        key: ID
        seed_field: ORGANIZATION_ID
      - type: simple_lookup
        lookup_table: var/tables/waivers.csv
        key: ID
        seed_field: WAIVER_ID
      - type: simple_lookup
        lookup_table: var/tables/tools_x_applications.csv
        key: APP_ID
        seed_field: ID
      - type: lookup_replace
        lookup_table: var/tables/waiver_categories_lu.csv
        key: CODE
        seed_field: WAIVER_ID
        lookup_field: DESCRIPTION
        output_field: DESCRIPTION
      - type: lookup_replace
        lookup_table: var/tables/waiver_statuses_lu.csv
        key: CODE
        seed_field: WAIVER_ID
        lookup_field: DESCRIPTION
        output_field: DESCRIPTION
      - type: simple_lookup
        lookup_table: var/tables/database_x_server.csv
        key: DATABASE_ID
        seed_field: DATABASE_ID
  _vtx_origin: AUTO_V2:usr/config/auto_v2/table_aggregator_vtx.yaml

      - alias: storage_t2_bu_vm_and_server
        path: var/tables/billing2026.csv
        left_key: Hostname
        right_key: Attribute 2
        normalizations:
        - normalize_case: true
        - force_short_hostname: true
        right_table_filters:
        - field: Period
          operator: ==

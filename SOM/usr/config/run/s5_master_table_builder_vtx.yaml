_vtx:
  schema: v1
  kind: processor
  id: master_table_builder_vtx
  title: Master Table Builder VTX
  description: Staged master builder for application/server inventories.
  owner: default
  version: 1.0.0
  tags:
  - inventory
  - masterdata
  - decisions
  consumers:
  - usr/scripts/default/master_table_builder_vtx.py
  _vtx_origin: CUSTOM:usr/config/custom/master_table_builder_vtx.yaml
config:
  payload:
    schema_contracts:
      raw_application_table:
        path: var/masterdata/raw_application_table.parquet
        anchor_field: ID
      raw_server_table:
        path: var/masterdata/raw_server_table.parquet
        anchor_field: Hostname
      application_approximation:
        path: var/masterdata/application_approximation.parquet
        anchor_field: ID
      master_applications:
        path: var/masterdata/master_applications.parquet
        anchor_field: ID
      master_servers:
        path: var/masterdata/master_servers.parquet
        anchor_field: Hostname
    jobs:
    - id: build_billing_server_only
      enabled: true
      base:
        path: var/masterdata/s2_master_servers.csv
        anchor_field: RECORDID
      joins:
      - alias: windows_wvmstor
        path: var/tables/billing2026.csv
        left_key: Hostname
        right_key: Attribute 1 (Name)
        normalizations:
        - normalize_case: true
        - force_short_hostname: true
        right_table_filters:
        - field: Period
          operator: ==
          value: '202605'
        - field: Service Category
          operator: in
          values:
          - Unix Servers
          - Window Servers
        - field: Service
          operator: ==
          value: WVMSTOR
        include_fields:
        - source_field: Charges
          output_field: charges_wvmstor
      - alias: windows_winlinvm
        path: var/tables/billing2026.csv
        left_key: Hostname
        right_key: Attribute 1 (Name)
        normalizations:
        - normalize_case: true
        - force_short_hostname: true
        right_table_filters:
        - field: Period
          operator: ==
          value: '202605'
        - field: Service Category
          operator: in
          values:
          - Unix Servers
          - Window Servers
        - field: Service
          operator: ==
          value: WINLINVM
        include_fields:
        - source_field: Charges
          output_field: charges_winlinvm
      - alias: windows_winwindows
        path: var/tables/billing2026.csv
        left_key: Hostname
        right_key: Attribute 1 (Name)
        normalizations:
        - normalize_case: true
        - force_short_hostname: true
        right_table_filters:
        - field: Period
          operator: ==
          value: '202605'
        - field: Service Category
          operator: in
          values:
          - Unix Servers
          - Window Servers
        - field: Service
          operator: ==
          value: WINDOWS
        include_fields:
        - source_field: Charges
          output_field: charges_windows
      - alias: windows_wincloud
        path: var/tables/billing2026.csv
        left_key: Hostname
        right_key: Attribute 1 (Name)
        normalizations:
        - normalize_case: true
        - force_short_hostname: true
        right_table_filters:
        - field: Period
          operator: ==
          value: '202605'
        - field: Service Category
          operator: in
          values:
          - Unix Servers
          - Window Servers
        - field: Service
          operator: ==
          value: WINCLOUD
        include_fields:
        - source_field: Charges
          output_field: charges_wincloud
      - alias: windows_vmserve
        path: var/tables/billing2026.csv
        left_key: Hostname
        right_key: Attribute 1 (Name)

          output_field: charges_storage_t2_bu_server
      - alias: storage_t2_bu_sql_db
        path: var/tables/billing2026.csv
        left_key: Hostname
        right_key: Attribute 2
        normalizations:
        - normalize_case: true
        - force_short_hostname: true
        right_table_filters:
        - field: Period
          operator: ==
          value: '202605'
        - field: Service Category
          operator: ==

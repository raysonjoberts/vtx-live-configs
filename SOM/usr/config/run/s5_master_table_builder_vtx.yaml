        left_key: Hostname
        right_key: Attribute 2
        normalizations:
        - normalize_case: true
        - force_short_hostname: true
        right_table_filters:
        - field: Period
          operator: ==
          value: '202605'
        - field: Service Category
          operator: ==
          value: Storage
        - field: Service
          operator: ==
          value: T2
        - field: Attribute 1 (Name)
          operator: ==
          value: BACKUP of VM Server & BACKUP of Server
        include_fields:
        - source_field: Charges
          output_field: charges_storage_t2_bu_vm_and_server
      outputs:
        parquet: var/masterdata/billing_servers_only_v2.parquet
        csv: var/masterdata/billing_servers_only_v2.csv
  _vtx_origin: CUSTOM:usr/config/custom/s5_master_table_builder_vtx.yaml

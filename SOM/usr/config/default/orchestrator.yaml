scheduler:
  max_workers: 4

  # Global throttle for backbone checks (checks/sec).
  # With 1.0, you check ~1 backbone job per second (smoothly).
  backbone_check_hz: 1.0


  # tick rate for the main loop / backbone checking
  backbone_tick_hz: 20

  # target wall-clock time spent per second on backbone freshness checks (ms)
  backbone_target_ms_per_sec: 25

  # how many stat samples to benchmark at startup (role-filtered)
  backbone_stat_benchmark_samples: 12

  # how many total stat calls to time during benchmark (higher = steadier)
  backbone_stat_benchmark_iters: 200

# ------------------------------------------------------------
# Cron / ad-hoc jobs (schedule-driven)
# ------------------------------------------------------------
cron_jobs:
  - id: Run Snapshot Statistics
    enabled: true
    role: server
    script: usr/scripts/default/snapshot_statistics.py
    args: --mode=auto
    cwd: "" # default BTDM_ROOT
    env: { }
    schedule:
      cron: "30 22 * * *" # alternatives: { daily: "02:30" } or { cron: "*/5 * * * *" }
    timeout_seconds: 1800
    retries: 1
    backoff_seconds: 10
    jitter_seconds: 5 # random 0..5s delay before run
    run_on_start: false

  - id: Run Data Source Type Profiler
    enabled: true
    role: server
    script: usr/scripts/default/datasource_type_profiler.py
    args: --mode=auto
    cwd: "" # default BTDM_ROOT
    env: { }
    schedule:
      cron: "1 12 * * 0" # alternatives: { daily: "02:30" } or { cron: "*/5 * * * *" }
    timeout_seconds: 1800
    retries: 1
    backoff_seconds: 10
    jitter_seconds: 5 # random 0..5s delay before run
    run_on_start: false


  - id: Copy var/interactive /views to dailysnapshot
    enabled: true
    role: server
    script: usr/utils/file_move.py
    args: >
      --source "var/interactive/views/*.csv"
      --dest "var/dailysnapshot"
      --mode copy
      --append-date yes
      --date-format %Y%m%d
      --skip-missing yes
    schedule:
      cron: "41 18 * * *"
    timeout_seconds: 180
    retries: 1
    backoff_seconds: 10

  - id: Copy var/interactive /data to dailysnapshot
    enabled: true
    role: server
    script: usr/utils/file_move.py
    args: >
      --source "var/interactive/data/*.csv"
      --dest "var/dailysnapshot"
      --mode copy
      --append-date yes
      --date-format %Y%m%d
      --skip-missing yes
    schedule:
      cron: "41 18 * * *"
    timeout_seconds: 180
    retries: 1
    backoff_seconds: 10

  - id: Copy var/tables/views to dailysnapshot
    enabled: true
    role: server
    script: usr/utils/file_move.py
    args: >
      --source "var/tables/views/*.csv"
      --dest "var/dailysnapshot"
      --mode copy
      --append-date yes
      --date-format %Y%m%d
      --skip-missing yes
    schedule:
      cron: "45 18 * * *"
    timeout_seconds: 180
    retries: 1
    backoff_seconds: 10

  - id: Copy var/interactive to dailysnapshot
    enabled: true
    role: server
    script: usr/utils/file_move.py
    args: >
      --source "var/interactive/*.csv"
      --dest "var/dailysnapshot"
      --mode copy
      --append-date yes
      --date-format %Y%m%d
      --skip-missing yes
    schedule:
      cron: "45 18 * * *"
    timeout_seconds: 180
    retries: 1
    backoff_seconds: 10

  - id: Copy var/tables to dailysnapshot
    enabled: true
    role: server
    script: usr/utils/file_move.py
    args: >
      --source "var/tables/*.csv"
      --dest "var/dailysnapshot"
      --mode copy
      --append-date yes
      --date-format %Y%m%d
      --skip-missing yes
    schedule:
      cron: "40 18 * * *"
    timeout_seconds: 180
    retries: 1
    backoff_seconds: 10


  - id: Copy var/interactive/data to dailysnapshot
    enabled: true
    role: server
    script: usr/utils/file_move.py
    args: >
      --source "var/interactive/data/*.csv"
      --dest "var/dailysnapshot"
      --mode copy
      --append-date yes
      --date-format %Y%m%d
      --skip-missing yes
    schedule:
      cron: "40 18 * * *"
    timeout_seconds: 180
    retries: 1
    backoff_seconds: 10

  - id: Move zipped logs to log archive
    enabled: true
    role: server
    script: usr/utils/file_move.py
    args: >
      --source "var/logs/*.gz"
      --dest "var/logarchive"
      --mode move
      --append-date no
      --date-format %Y%m%d
      --skip-missing yes
    schedule:
      cron: "47 * * * *"
    timeout_seconds: 180
    retries: 1
    backoff_seconds: 10

  - id: Move zipped logs to log archive
    enabled: true
    role: client
    script: usr/utils/file_move.py
    args: >
      --source "var/logs/*.gz"
      --dest "var/logarchive"
      --mode move
      --append-date no
      --date-format %Y%m%d
      --skip-missing yes
    schedule:
      cron: "47 * * * *"
    timeout_seconds: 180
    retries: 1
    backoff_seconds: 10


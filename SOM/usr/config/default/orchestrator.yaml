#
# ------------------------------------------------------------
# Backbone jobs (orchestrated, freshness-driven)
# - inputs/outputs defined here so orchestrator can check mtimes directly
# - scripts can be gradually refactored to become minimalist + per-artifact
# ------------------------------------------------------------
backbone_jobs:
  - id: Run Intake Processor
    enabled: true
    role: server
    script: usr/scripts/default/intake_processor.py
    args: >
      --mode=auto
    #check_every_seconds: 60
    settle_seconds: 2
    debounce_seconds: 5
    rule: any_file_in_dir
    watch_dirs:
      - var/customerdata
    watch_glob:
    timeout_seconds: 120
    retries: 1
    backoff_seconds: 10
    jitter_seconds: 0

  - id: Run config_compiler
    enabled: true
    role: server
    script: usr/scripts/default/config_compiler.py
    args: 
    #check_every_seconds: 60
    settle_seconds: 2
    debounce_seconds: 5
    rule: mtime_input_newer_than_last_success_marker
    config_inputs:
      - usr/config/run/orchestrator.yaml
    watch_dirs:
      - usr/config/default
      - usr/config/auto_v2
      - usr/config/custom
    watch_glob:
    timeout_seconds: 120
    retries: 1
    backoff_seconds: 10
    jitter_seconds: 0


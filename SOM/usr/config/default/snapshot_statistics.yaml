tables:
  - name: applications
    status:
      column: ACTIVE          # the column in the snapshot
      active_values: ["Y"]    # what counts as Active
      inactive_values: ["N"]  # what counts as Not Active


  - name: consolidated_application_view
    status:
      column: ACTIVE          # the column in the snapshot
      active_values: ["Y"]    # what counts as Active
      inactive_values: ["N"]  # what counts as Not Active

_autogen:
  orchestrator:        
    id: "Snapshot Statistics - {name}"
    role: server
    args: [--mode=auto]
    script: usr/scripts/default/snapshot_statistics.py
    job_type: cron
    schedule: "30 21 * * *"
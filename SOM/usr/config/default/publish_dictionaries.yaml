version: 1

# All paths can be absolute, or relative to VTX_ROOT
jobs:
  - id: Migration Program Attributes Dictionary
    enabled: true
    title: "Migration Program Attribute Dictionary"
    subtitle: "Migration Program Attribute Framework."

    # Source dictionary YAML(s) to publish
    sources:
      - usr/config/run/data_source_analysis.yaml   # <-- your comprehensive attribute YAML

    # Where to read the list from inside each YAML file
    # (your example uses "criteria:" as the list key)
    list_key: "criteria"

    # Output HTML path
    output_html: "var/dictionaries/Migration_program_attribute_dictionary.html"

    # Which YAML keys to publish, and how to label them in HTML
    # (keys can contain spaces; they’ll be read literally)
    fields:
      - key: "blocks"
        label: "Phase"
      - key: "priority_level"
        label: "Attribute Priority"
      - key: "recommended source"
        label: "Recommended Source"
      - key: "description"
        label: "Description"
      - key: "how used"
        label: "How Used"

    # Optional ordering
    sort:
      - key: "blocks"
        order: asc
        custom_order:
          - Discover
          - Program Strategy
          - Rationalize
          - Migration Planning
          - Migration Execution
      - key: "priority_level"
        order: asc
      - key: "type"
        custom_order:
          - application
          - server
      - key: "attribute"
        order: asc

    # Optional: allow inclusion filtering (leave empty to include all)
    include:
      # phases: ["Discover", "Migration Planning"]
      # priorities: [1, 2]
      # types: ["application", "server"]
      phases: []
      priorities: []
      types: []

    exclude:
      types: ["general"]  

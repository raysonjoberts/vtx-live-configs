  - name: "inferred_server_attributes"
    output_name: "inferred_server_attributes.csv"

    # The key (ID) that will be included in the output to correlate with other datasets
    key:
      source: "srv"           # must match a 'sources.alias' below
      field: "RECORDID" # column name in that source used as the key

    # All source tables to use (these are typically produced into var/tables by VTX)
    sources:
      - alias: "srv"
        file: "views\\consolidated_server_view.csv"
        #join_key:    # if omitted, defaults to key.field

    #  - alias: "srv"
    #    file: "serverinventories_sds.csv"
    #    join_key: "APPLICATION_ID"

    # Define one-or-more inferred fields; each has ordered rules (first match wins)
    infer:
      - field: "Inferred Location"
        default: 
        rules:
          - when:
              all:
                - { source: "srv", field: "IPADDRESS", op: "regex", value: '^10\.110\.' }
    #            - { source: "app", field: "DECOMMISSION_DATE", op: "==", value: "" }
            set: "CMCC"
          - when:
              all:
                - { source: "srv", field: "IPADDRESS", op: "regex", value: '^10\.210\.' }
    #            - { source: "app", field: "DECOMMISSION_DATE", op: "==", value: "" }
            set: "SSDC"


      
          
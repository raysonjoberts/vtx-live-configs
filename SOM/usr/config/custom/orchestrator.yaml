# ------------------------------------------------------------
# Backbone jobs (orchestrated, freshness-driven)
# - inputs/outputs defined here so orchestrator can check mtimes directly
# - scripts can be gradually refactored to become minimalist + per-artifact
# ------------------------------------------------------------
backbone_jobs:
  - id:  file_distribution_engine - psdo_consolidated_apps_base_062302026
    enabled: true
    role: server
    script: usr/scripts/default/file_distribution_engine.py
    args: --job "psdo_consolidated_apps_base_062302026"
    settle_seconds: 2
    debounce_seconds: 5
    rule: mtime_input_newer_than_last_success_marker
    timeout_seconds: 120
    retries: 1
    backoff_seconds: 10
    jitter_seconds: 0
    marker_match: any
    inputs:
    - var/tables/views/s5_migrations_consolidated_application_table_expanded_by_environment.csv
    config_inputs:
    - usr/config/run/file_distribution_engine.yaml
    - usr/config/custom/file_distribution_engine.yaml
    outputs:
    - C:/Users/Jayson.Roberts/State of Maine/DAFS-MaineIT CCOE - Data Dog/Correlated_Data\CCoE_Inventory/migrations_application_view.xlsx
  - id: file_distribution_engine - psdo_consolidated_applications_interactive_06302026
    enabled: true
    role: server
    script: usr/scripts/default/file_distribution_engine.py
    args: --job "psdo_consolidated_applications_interactive_06302026"
    settle_seconds: 2
    debounce_seconds: 5
    rule: mtime_input_newer_than_last_success_marker
    timeout_seconds: 120
    retries: 1
    backoff_seconds: 10
    jitter_seconds: 0
    marker_match: any
    inputs:
    - C:/Users/Jayson.Roberts/State of Maine/DAFS-MaineIT CCOE - Data Dog/Correlated_Data\CCoE_Inventory/migrations_application_view.xlsx
    config_inputs:
    - usr/config/run/file_distribution_engine.yaml
    - usr/config/custom/file_distribution_engine.yaml
    outputs:
    - var/interactive/data/migrations_app_view.csv

  - id: Copy consolidated application view to Archer
    enabled: true
    role: client
    script: usr/utils/file_move.py
    args: >
      --source "var/tables/views/consolidated_application_view.csv"
      --dest   "C:\Users\Jayson.Roberts\State of Maine\MaineIT OPTIV Project - Dataset\ConsolidatedInventory"
      --mode   copy
      --append-date no
      --date-format %Y%m%d
      --skip-unchanged no
    #check_every_seconds: 60
    settle_seconds: 2
    debounce_seconds: 5
    rule: mtime_any_input_newer_than_any_output
    require_inputs_exist: true
    inputs:
      - "var/tables/views/consolidated_application_view.csv"
    outputs:
      # choose the exact output file path if stable, otherwise use a marker file approach later
      - "C:\\Users\\Jayson.Roberts\\State of Maine\\MaineIT OPTIV Project - Dataset\\ConsolidatedInventory\\consolidated_application_view.csv"
    timeout_seconds: 120
    retries: 1
    backoff_seconds: 10
    jitter_seconds: 0

  - id: Copy MDT Data File To Dave Share
    enabled: true
    role: client
    script: usr/utils/file_move.py
    args: >
      --source "var/interactive/data/migrations_app_view.csv"
      --dest   "C:\Users\Jayson.Roberts\State of Maine\DAFS-MaineIT CCOE - Data Dog\Correlated_Data\CCoE_Inventory\dave_views"
      --mode   copy
      --append-date no
      --date-format %Y%m%d
      --skip-unchanged no
    #check_every_seconds: 60
    settle_seconds: 2
    debounce_seconds: 5
    rule: mtime_any_input_newer_than_any_output
    require_inputs_exist: true
    inputs:
      - "var/interactive/data/migrations_app_view.csv"
    outputs:
      # choose the exact output file path if stable, otherwise use a marker file approach later
      - "C:\\Users\\Jayson.Roberts\\State of Maine\\State of Maine\\DAFS-MaineIT CCOE - Data Dog\\Correlated_Data\\CCoE_Inventory\\dave_views\\migrations_app_view.csv"
    timeout_seconds: 120
    retries: 1
    backoff_seconds: 10
    jitter_seconds: 0

pipeline_jobs:
- id: Version 2 Data Handling Pipeline
  enabled: true
  role: server
  cooldown_seconds: 60
  trigger_markers:
  - var/state/orchestrator_markers/Run_Intake_Processor.marker
  - var/state/orchestrator_markers/Run_config_compiler.marker
  stages:
  - id: Stage 1.1- Raw Application Tables
    script: usr/scripts/default/s1_application_raw_table_builder.py
  - id: Stage 1.2- Raw Server Tables
    script: usr/scripts/default/s1_server_raw_table_builder.py
  - id: Stage 2- Master Servers
    script: usr/scripts/default/s2_master_table_builder_vtx.py
  - id: Stage 3- Initial Views
    script: usr/scripts/default/s3_master_view_builder_vtx.py
  - id: Stage 4- Approximation Engine
    script: usr/scripts/analysis/s4_approximation_engine_applications_vtx.py
  - id: Stage 4- Tagging Engine
    script: usr/scripts/default/s4_tag_engine.py
  - id: Stage 5- Final View Builder
    script: usr/scripts/default/s5_master_view_builder.py
  #- id: Stage 5: Tag Engine
  #  script: usr/scripts/default/tag_engine.py
  #- id: Master Views
  #  script: usr/scripts/default/master_view_builder_vtx.py


- id: Reporting Pipeline
  enabled: true
  role: server
  cooldown_seconds: 60
  trigger_markers:
  - var/state/orchestrator_markers/Version_2_Data_Handling_Pipeline__Stage_5-_Final_View_Builder.marker
  stages:
  - id: Stage 1- Run Migration Program Dictionary
    script: usr/scripts/default/migration_program_dictionary.py
  - id: Stage 1.2- Run Program Timeline Report
    script: usr/scripts/default/program_timeline.py
  - id: Stage 1.3- Publish Migration Data Dictionary
    script: usr/scripts/default/publish_dictionaries.py
  - id: Stage 2- Run Datasource Analysis Mapping Report
    script: usr/scripts/default/data_source_analysis_mapping.py
  - id: State 3-  Run Visual Stats Timeline
    script: usr/scripts/dashboards/visual_stats_timeline_vtx.py
  - id: Stage 4- Run Visual Program Attribute Mapping
    script: usr/scripts/dashboards/visual_program_attribute_mapping_vtx.py
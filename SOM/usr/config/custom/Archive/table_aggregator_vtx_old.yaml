_vtx:
  schema: v1
  kind: transform
  id: table_aggregator
  title: Table Aggregator (VTX)
  description: Aggregate and enrich tables via lookup transactions.
  owner: default
  version: 1.0.0
  tags:
  - aggregation
  - transform
  - dashboard
  - auto
  - aggregation
  consumers:
  - usr/scripts/default/application_raw_table_builder.py
  created_utc: ''
  updated_utc: ''
config:
  io:
    inputs: []
    outputs: []
  run:
    enabled: true
    role: any
    log_level: INFO
    dry_run: false
    fail_fast: false
    cwd: ''
  payload:
    jobs:
      - id: raw_application_table
        enabled: true
        inputs:
        - var/tables/applications.csv
        - var/tables/application_x_database.csv
        - var/tables/application_types_lu.csv
        - var/tables/application_status_lu.csv
        - var/tables/business_category_lu.csv
        - var/tables/risk_urgency_lu.csv
        - var/tables/ps_development_lu.csv
        - var/tables/tools_x_applications.csv
        - var/tables/tools_lu.csv
        - var/tables/bfms_organizations.csv
        - var/tables/who_administers_lu.csv
        - var/tables/databases.csv
        - var/tables/who_maintains_lu.csv
        - var/tables/auth_method_lu.csv
        - var/tables/app_x_tools.csv
        - var/tables/third_party_tools.csv
        - var/tables/importance_lu.csv
        - var/tables/database_type_lu.csv
        - var/tables/servers_x_applications.csv
        - var/tables/serverinventories.csv
        - var/tables/staff_x_applications.csv
        - var/tables/staff.csv
        - var/tables/staff_roles_lu.csv
        - var/tables/tlp_lu.csv
        outputs:
          parquet: var/masterdata/raw_application_table.parquet
          csv: var/masterdata/raw_application_table.csv
        seed: var/tables/applications.csv
        anchor: ID
        delimiter: ' ; '
        transactions:
        - type: simple_lookup
          lookup_table: var/tables/application_x_database.csv
          key: APP_ID
          seed_field: ID
          fields:
          - DATABASE_ID
        - type: lookup_replace
          lookup_table: var/tables/application_types_lu.csv
          key: ID
          seed_field: APPLICATION_TYPE_ID
          lookup_field: DESCRIPTION
          output_field: APPLICATION_TYPE_ID
        - type: lookup_replace
          lookup_table: var/tables/application_status_lu.csv
          key: ID
          seed_field: APPLICATION_STATUS_ID
          lookup_field: DESCRIPTION
          output_field: APPLICATION_STATUS_ID
        - type: lookup_replace
          lookup_table: var/tables/business_category_lu.csv
          key: ID
          seed_field: BUSINESS_CATEGORY
          lookup_field: DESCRIPTION
          output_field: BUSINESS_CATEGORY
        - type: lookup_replace
          lookup_table: var/tables/risk_urgency_lu.csv
          key: ID
          seed_field: RISK_URGENCY_ID
          lookup_field: DESCRIPTION
          output_field: RISK_URGENCY_ID
        - type: simple_lookup
          lookup_table: var/tables/ps_development_lu.csv
          key: ID
          seed_field: PS_DEVELOPMENT_CODE
          fields:
          - DESCRIPTION -> DevelopmentSource
        - type: simple_lookup
          lookup_table: var/tables/tools_x_applications.csv
          key: APP_ID
          seed_field: ID
          fields:
          - TOOL_VERSION_BRICK_ID
        - type: simple_lookup
          lookup_table: var/tables/tools_lu.csv
          key: ID
          seed_field: TOOL_VERSION_BRICK_ID
          fields:
          - DESCRIPTION -> Tools
          - TOOL_VENDOR_ID
        - type: simple_lookup
          lookup_table: var/tables/bfms_organizations.csv
          key: ID
          seed_field: ORGANIZATION_ID
          fields:
          - DEPARTMENT_NUMBER
          - DEPARTMENT_NAME
          - BUREAU_NAME
          - ORGANIZATION
          - DEPARTMENT_ACRONYM
          - BUREAU_ACRONYM
          - ORGANIZATION_ACRONYM
        - type: simple_lookup
          lookup_table: var/tables/ps_development_lu.csv
          key: ID
          seed_field: PS_DEVELOPMENT_CODE
          fields:
          - DESCRIPTION -> PS_DEVELOPMENT_CODE_NAMETmp
        - type: lookup_replace
          lookup_table: var/tables/who_administers_lu.csv
          key: ID
          seed_field: WHO_ADMINISTERS
          lookup_field: DESCRIPTION
          output_field: WHO_ADMINISTERS
        - type: simple_lookup
          lookup_table: var/tables/databases.csv
          key: ID
          seed_field: DATABASE_ID
          fields:
          - NAME -> DatabaseName
          - INSTANCE -> DatabaseInstance
          - ENVIRONMENT -> DatabaseEnvironment
          - CONTACT -> DatabaseContact
          - TYPE -> DBType
        - type: lookup_replace
          lookup_table: var/tables/who_maintains_lu.csv
          key: ID
          seed_field: WHO_MAINTAINS
          lookup_field: DESCRIPTION
          output_field: WHO_MAINTAINS
        - type: lookup_replace
          lookup_table: var/tables/auth_method_lu.csv
          key: ID
          seed_field: AUTHENTICATION_METHOD
          lookup_field: DESCRIPTION
          output_field: AUTHENTICATION_METHOD
        - type: simple_lookup
          lookup_table: var/tables/app_x_tools.csv
          key: APP_ID
          seed_field: ID
          fields:
          - THIRD_PARTY_TOOL_ID
        - type: simple_lookup
          lookup_table: var/tables/third_party_tools.csv
          key: ID
          seed_field: THIRD_PARTY_TOOL_ID
          fields:
          - VENDOR -> ThirdPartyToolVendor
          - PRODUCT_NAME -> ThirdPartyTool
        - type: lookup_replace
          lookup_table: var/tables/importance_lu.csv
          key: ID
          seed_field: IMPORTANCE
          lookup_field: DESCRIPTION
          output_field: IMPORTANCE
        - type: lookup_replace
          lookup_table: var/tables/database_type_lu.csv
          key: ID
          seed_field: DBType
          lookup_field: DESCRIPTION
          output_field: DBType
        - type: simple_lookup
          lookup_table: var/tables/servers_x_applications.csv
          key: APP_ID
          seed_field: ID
          fields:
          - RECORDID
        - type: simple_lookup
          lookup_table: var/tables/serverinventories.csv
          key: RECORDID
          seed_field: RECORDID
          fields:
          - SERVERNAME
          - ENVIRONMENT
          - Inferred Server Location
          delimiter: ' ; '
        - type: simple_lookup
          lookup_table: var/tables/staff_x_applications.csv
          key: APP_ID
          seed_field: ID
          fields:
          - STAFF_ID
          - STAFF_ROLE_ID
        - type: simple_lookup
          lookup_table: var/tables/staff.csv
          key: ID
          seed_field: STAFF_ID
          fields:
          - STAFF_NAME
        - type: simple_lookup
          lookup_table: var/tables/staff_roles_lu.csv
          key: ID
          seed_field: STAFF_ROLE_ID
          fields:
          - DESCRIPTION -> StaffRole
        - type: lookup_replace
          lookup_table: var/tables/tlp_lu.csv
          key: ID
          seed_field: TLP_RATING
          lookup_field: TLP
          output_field: TLP_RATING
        - type: transform_tidy
          anchor: ID
          column_field: StaffRole
          value_field: STAFF_NAME
          drop_fields:
          - STAFF_ID
          - STAFF_ROLE_ID
          delimiter: ' ; '

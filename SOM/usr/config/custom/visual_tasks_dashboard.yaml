dashboards:
- name: tasks
  title: Tasks — Program Management
  subtitle: Current tasks and status
  source_csv: var/interactive/views/tasks.csv
  output_html: var/reporting/tasks.html
  log_csv: var/tables/tasks_log.csv
  log_key_field: task_id
  log_timestamp_field: timestamp
  log_last_updated_column: update_text
  status_field: status
  name_field: task_label
  assignee_field: assignee
  created_field: created_at
  id_field: task_id
  search_fields:
  - task_id
  - task_label
  - status
  - priority
  - phase
  - assignee
  display_columns:
  - field: task_id
    label: Task ID
    type: text
  - field: task_label
    label: Task Name
    type: text
  - field: status
    label: Status
    type: status
  - field: priority
    label: Priority
    type: text
  - field: phase
    label: Phase
  - field: milestone
    label: Milestone
  - field: loe
    label: LOE
    type: text
  - field: assignee
    label: Assignee
    type: text
  - field: updated_at
    label: Last Update
    type: datetime
  - field: created_at
    label: Created
    type: datetime


    _autogen:
      orchestrator:
        job_type: backbone
        role: server
        id: "Visual Tasks Dashboard - {name}"
        script: usr/scripts/default/visual_tasks_dashboard.py
        args: []
        rule: mtime_input_newer_than_last_success_marker
        marker_match: any                          # optional list (or string)
        inputs: ["{source_csv}"]      # wildcard gather
        outputs: ["{output_html}"]
        #watch_glob: "*.yaml"        # optional; omit to include all files
        watch_recursive: true         # optional; default false
        #check_every_seconds: 30
        settle_seconds: 2
        timeout_seconds: 120
        retries: 1
        backoff_seconds: 10
        jitter_seconds: 0        
      stretch:
        sync_type: internal_to_external
        internal_file: "{output_html}"
        external_dir: C:\Users\Jayson.Roberts\State of Maine\DAFS-MaineIT CCOE - Data Dog\Correlated_Data\Reports\Dashboards
        csv_xlsx_convert: false
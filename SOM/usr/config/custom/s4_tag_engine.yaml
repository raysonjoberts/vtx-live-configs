        condition_logic: all
        rules:
        - id: active_inferred_location_ssdc
          tag_value: on_prem-multisite
          conditions:

          - field: Inferred Server Location
            operator: contains
            value: CMCC
          - field: Inferred Server Location
            operator: contains
            value: SSDC
      - id: app_ecosystem_location_cmcc
        tag_column: tag_app_ecosystem_location
        source: rule
        key_fields: null
        condition_logic: all
        rules:
        - id: ecosystem_cmcc
          tag_value: CMCC
          conditions:

          - field: Inferred Server Location
            operator: notcontains
            value: SSDC
          - field: Inferred Server Location
            operator: contains
            value: CMCC
      - id: app_ecosystem_location_ssdc
        tag_column: tag_app_ecosystem_location
        source: rule
        key_fields: null
        condition_logic: all
        rules:
        - id: ecosystem_ssdc
          tag_value: SSDC
          conditions:

          - field: Inferred Server Location
            operator: notcontains
            value: CMCC
          - field: Inferred Server Location
            operator: contains
            value: SSDC
      - id: app_ecosystem_location_on_prem_multi-site
        tag_column: tag_app_ecosystem_location
        source: rule
        key_fields: null
        condition_logic: all
        rules:
        - id: ecosystem_multisite
          tag_value: on_prem-multisite
          conditions:

          - field: Inferred Server Location
            operator: contains
            value: CMCC
          - field: Inferred Server Location
            operator: contains
            value: SSDC

      - id: contains_sql
        tag_column: tag_sql
        source: rule
        #key_fields:
        match_columns:
          - Environment
        condition_logic: all
        first_match_only: true
        rules:
        - id: EXP
          tag_value: EXP
          conditions:
          - field: TYPE
            operator: ==
            value: '2'
          - field: USAGE
            operator: ==
            value: EXP
        - id: REG
          tag_value: REG
          conditions:
          - field: TYPE
            operator: ==
            value: '2'
          - field: USAGE
            operator: ==
            value: REG

      - id: migration_planning_exclusions
        tag_column: tag_migration_planning_exclusions
        source: rule
        #key_fields:
        match_columns:
          - Environment
        condition_logic: all
        first_match_only: false
        rules:
        - id: Enterprise Backup
          tag_value: Enterprise_Backup
          conditions:

          - field: DEPARTMENT_ACRONYM
            operator: "!="
            value: DAFS
        - id: Minimal_OS_2012
          tag_value: Minimal_OS
          conditions:

          - field: OS
            operator: contains
            value: Windows
          - field: OS Version
            operator: contains
            value: '2012'
        - id: Minimal_OS_2016
          tag_value: Minimal_OS
          conditions:

          - field: OS
            operator: contains
            value: Windows
          - field: OS Version
            operator: contains
            value: '2016'
        - id: has_sql
          tag_value: app_has_sql
          conditions:

          - field: TYPE
            operator: contains
            value: '2'
        - id: is_dmz
          tag_value: app_has_dmz_server
          conditions:

          - field: IP Address
            operator: contains
            value: '198.182.162.'


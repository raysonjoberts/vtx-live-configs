_vtx:
  schema: v1
  kind: transform
  id: tag_engine
  title: Tag Engine
  description: Rule-driven tagging for application entities
  owner: default
  version: 1.0.0
  tags:
  - core
  created_utc: ''
  updated_utc: ''
  consumers:
  - usr/scripts/default/tag_engine.py
  _vtx_origin: DEFAULT:usr/config/default/tag_engine.yaml
config:
  payload:
    jobs:
    - id: tag_engine
      enabled: true
      inputs:
      #- var/masterdata/master_applications.parquet
      - var/masterdata/s3_consolidated_application_table_expanded_by_environment.csv
      outputs:
      - var/metadata/s4_tags_application.csv
      anchor_field: ID
      entity_type: application
      key_delimiter: ;
      tags:
      - id: application_active
        tag_column: ACTIVE
        source: rule
        key_fields: null
        #condition_logic: any
        first_match_only: true
        rules:
        - id: active_applications
          tag_value: Y
          condition_logic: any
          conditions:
          - field: APPLICATION_STATUS_ID
            operator: contains
            value: Production
          - field: APPLICATION_STATUS_ID
            operator: contains
            value: Development
      - id: adoption_stage
        tag_column: tag_adoption_stage
        source: rule
        key_fields: null
        condition_logic: all
        first_match_only: true
        rules:
        - id: adoption_stage_dafs
          tag_value: early
          conditions:
          - field: DEPARTMENT_ACRONYM
            operator: ==
            value: DAFS
        - id: adoption_stage_dhhs
          tag_value: early
          conditions:

          - field: DEPARTMENT_ACRONYM
            operator: ==
            value: DHHS
        - id: adoption_stage_dhhs
          tag_value: early
          conditions:

          - field: DEPARTMENT_ACRONYM
            operator: ==
            value: DOT
      - id: complexity_by_environment
        tag_column: tag_complexity
        source: rule
        #key_fields:
        match_columns:
          - Environment
        condition_logic: all
        first_match_only: true
        rules:
        - id: complexity_low
          tag_value: low
          conditions:

          - field: Hostname
            operator: in_range
            value:
            - 1
            - 2
            agg: count
        - id: complexity_medium
          tag_value: medium
          conditions:

          - field: Hostname
            operator: in_range
            value:
            - 3
            - 4
            agg: count
        - id: complexity_high
          tag_value: high
          conditions:

          - field: Hostname
            operator: '>='
            value: 5
            agg: count
      - id: scope_azure_candidate
        tag_column: tag_scope
        source: rule
        key_fields: null
        condition_logic: all
        rules:
        - id: ACTIVE_windows_no_linux
          tag_value: azure_candidate
          conditions:

          - field: OS
            operator: notcontains
            value: Linux
          - field: OS
            operator: contains
            value: Windows
      - id: scope_oci_candidate
        tag_column: tag_scope
        source: rule
        key_fields: null
        condition_logic: all
        rules:
        - id: ACTIVE_linux_no_windows
          tag_value: oci_candidate
          conditions:

          - field: OS
            operator: notcontains
            value: Windows
          - field: OS
            operator: contains
            value: Linux
      - id: scope_oci_multi_os
        tag_column: tag_scope
        source: rule
        key_fields: null
        condition_logic: all
        rules:
        - id: Active_multi-os
          tag_value: oci_candidate_multi-os
          conditions:

          - field: OS
            operator: contains
            value: Windows
          - field: OS
            operator: contains
            value: Linux
      - id: windows_os_2008
        tag_column: tag_os_version
        source: rule
        key_fields: null
        match_columns:
        - Environment        
        condition_logic: all
        rules:
        - id: os_windows_2008
          tag_value: os_windows_2008
          conditions:

          - field: OS
            operator: contains
            value: Windows
          - field: OS Version
